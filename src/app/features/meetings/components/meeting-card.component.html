<article class="meeting-card" [class.meeting-card--deleting]="deleting()">
  <div class="meeting-card__time">
    <span class="time-badge">{{ meeting().startTime }}</span>
    <span class="time-sep" aria-hidden="true">–</span>
    <span class="time-badge">{{ meeting().endTime }}</span>
  </div>

  <div class="meeting-card__body">
    <h3 class="meeting-card__title">{{ meeting().title }}</h3>
    <p class="meeting-card__meta">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
      </svg>
      {{ meeting().organizer }}
      <span class="dot" aria-hidden="true">·</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      {{ meeting().attendeesCount }} نفر
    </p>
  </div>

  <footer class="meeting-card__actions">
    <button type="button" class="btn-icon" aria-label="ویرایش جلسه {{ meeting().title }}"
            (click)="edit.emit(meeting())" [disabled]="deleting()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <button type="button" class="btn-icon btn-icon--danger" aria-label="حذف جلسه {{ meeting().title }}"
            (click)="delete.emit(meeting())" [disabled]="deleting()">
      @if (deleting()) {
        <span class="spinner spinner--sm" aria-hidden="true"></span>
      } @else {
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <polyline points="3 6 5 6 21 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M10 11v6M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" stroke="currentColor" stroke-width="2"/>
        </svg>
      }
    </button>
  </footer>
</article>
