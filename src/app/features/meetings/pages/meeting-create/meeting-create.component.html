<div class="form-page">
  <nav class="breadcrumb" aria-label="مسیر">
    <a routerLink="/meetings">جلسات</a>
    <span aria-hidden="true">›</span>
    <span>جلسه جدید</span>
  </nav>

  <h1 class="page-title">ایجاد جلسه جدید</h1>

  <div class="form-card">
    <app-meeting-form
      [rooms]="rooms()"
      [submitting]="submitting()"
      (formSubmit)="onCreate($event)"
      (cancel)="router.navigate(['/meetings'])"
    />
  </div>

  @if (errorMsg()) {
    <app-toast [message]="errorMsg()!" type="error" />
  }
</div>
